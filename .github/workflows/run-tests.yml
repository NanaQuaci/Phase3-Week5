name: Run Android Appium Tests with Allure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_PATH: ./src/test/resources/apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
  DEVICE_NAME: pixel_6a

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Appium and dependencies
        run: |
          npm install -g appium@latest appium-doctor allure-commandline
          appium driver install uiautomator2
          # Install netcat for connectivity checks
          sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6a
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false  # Let our script handle this
          emulator-boot-timeout: 900
          script: |
            set -e  # Exit on any error
            
            echo "==== SCRIPT EXECUTION STARTED ===="
            echo "Current directory: $(pwd)"
            echo "User: $(whoami)"
            echo "Available space: $(df -h . | tail -1)"
            
            # Wait for the emulator to be fully ready
            echo ">>> Waiting for emulator to be fully ready..."
            adb wait-for-device
            sleep 10  # Additional wait for services to be ready
            
            # Try to disable animations with retry logic
            echo ">>> Disabling animations with retries..."
            for i in {1..5}; do
              echo "Animation disable attempt $i/5"
              if adb shell settings put global window_animation_scale 0.0 && \
                 adb shell settings put global transition_animation_scale 0.0 && \
                 adb shell settings put global animator_duration_scale 0.0; then
                echo "Animations disabled successfully"
                break
              else
                echo "Animation disable failed, waiting..."
                sleep 5
              fi
            done
            
            # Verify device connection
            echo ">>> Device information:"
            adb devices -l
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model
            
            # Function to cleanup processes on exit
            cleanup() {
              echo ">>> Cleaning up processes..."
              if [ ! -z "$APPIUM_PID" ] && kill -0 $APPIUM_PID 2>/dev/null; then
                echo "Killing Appium server (PID: $APPIUM_PID)"
                kill $APPIUM_PID
                wait $APPIUM_PID 2>/dev/null || true
              fi
            }
            trap cleanup EXIT INT TERM
            
            echo ">>> Starting Appium server..."
            mkdir -p logs
            appium --log-level info --port 4723 --base-path /wd/hub > logs/appium.log 2>&1 &
            APPIUM_PID=$!
            echo "Appium server started with PID: $APPIUM_PID"
            
            echo ">>> Waiting for Appium server to be ready..."
            TIMEOUT=60
            while [ $TIMEOUT -gt 0 ]; do
              if nc -z localhost 4723; then
                echo "Appium server is responding on port 4723"
                # Additional check with curl
                if curl -s http://localhost:4723/wd/hub/status >/dev/null 2>&1; then
                  echo "Appium server status endpoint is ready!"
                  break
                fi
              fi
              echo "Waiting for Appium server... ($TIMEOUT seconds remaining)"
              sleep 2
              TIMEOUT=$((TIMEOUT - 2))
            done
            
            if [ $TIMEOUT -le 0 ]; then
              echo "ERROR: Appium server failed to start within timeout!"
              echo "=== Appium logs ==="
              cat logs/appium.log || echo "No Appium log available"
              exit 1
            fi
            
            echo ">>> Preparing test environment..."
            mkdir -p allure-results target/surefire-reports
            
            # Verify Maven and Java setup
            echo ">>> Environment verification:"
            java -version
            mvn -version
            
            echo ">>> Running Maven tests..."
            # Run tests with better error handling
            if mvn clean test -Dsurefire.suiteXmlFiles=testng.xml \
               -Dmaven.test.failure.ignore=false \
               -Dallure.results.directory=allure-results \
               --batch-mode --no-transfer-progress; then
              echo ">>> Tests completed successfully!"
              TEST_SUCCESS=true
            else
              echo ">>> Tests failed or encountered errors"
              TEST_SUCCESS=false
            fi
            
            echo ">>> Test execution summary:"
            echo "Working directory contents:"
            ls -la
            
            if [ -d "target/surefire-reports" ]; then
              echo "Surefire reports found:"
              ls -la target/surefire-reports/
              echo "Report contents preview:"
              find target/surefire-reports -name "*.xml" -exec echo "=== {} ===" \; -exec head -20 {} \; 2>/dev/null || true
            else
              echo "No surefire reports directory found"
            fi
            
            if [ -d "allure-results" ]; then
              echo "Allure results found:"
              ls -la allure-results/
            else
              echo "No allure results directory found"
            fi
            
            # Show Appium logs for debugging
            echo "=== Appium Server Logs ==="
            tail -50 logs/appium.log || echo "No Appium logs available"
            
            echo "==== SCRIPT EXECUTION COMPLETED ===="
            
            # Exit with appropriate code
            if [ "$TEST_SUCCESS" = "false" ]; then
              echo "Exiting with failure due to test errors"
              exit 1
            fi

      - name: Upload Appium Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      - name: Upload JUnit reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  deploy-allure-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        run: |
          if [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report from results..."
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure results found, creating empty report"
            mkdir -p allure-report
            cat > allure-report/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head><title>Test Results</title></head>
            <body>
              <h1>No Test Results Available</h1>
              <p>The test execution did not produce any Allure results.</p>
              <p>Please check the test logs for more information.</p>
            </body>
            </html>
            EOF
          fi

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages

  notify-slack:
    needs: [ test, deploy-allure-report ]
    runs-on: ubuntu-latest
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Send Slack notification
        run: |
          STATUS="${{ needs.test.result }}"
          EMOJI="❌"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          fi
          
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          
          curl -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"${EMOJI} Android Appium CI/CD finished with status: *${STATUS}*\nRepo: ${{ github.repository }}\nCommit: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|$(echo ${{ github.sha }} | cut -c1-7)>\nAllure Report: ${REPORT_URL}\"
          }" ${{ secrets.SLACK_WEBHOOK_URL }}